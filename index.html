<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--notte:#010D23;--blu:#02509D;--arancio:#F19004;--ar-testo:#A35F00;--ink:#3C3C3B;--ink2:#6E6E6D;--ink3:#9E9E9D;--linea:#E4E4E2;--fondo:#F2F2F0;--card:#fff;--ok:#2E6B2E;--ko:#9B2C1E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
.top{background:var(--notte);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;position:sticky;top:0;z-index:5}
.top .r{display:flex;align-items:center;justify-content:space-between}
.top img{height:26px}
.top .per{font-size:12px;color:#B9BBC0;text-align:right;line-height:1.3}
.top h1{font-weight:300;font-size:26px;margin:14px 0 10px;letter-spacing:.2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:500}
.chip.on{background:#fff;color:var(--notte);border-color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
main{padding:14px 12px 40px;max-width:720px;margin:0 auto}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
.k.acc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--arancio)}
.k .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);font-weight:500}
.k .v{font-family:'Syne',sans-serif;font-weight:700;font-size:27px;color:var(--notte);margin:6px 0 2px;letter-spacing:-.5px}
.k .v small{font-family:'DM Sans';font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0}
.k .s{font-size:12px;color:var(--ink2)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--ko);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:15px;font-weight:500;color:var(--notte);margin:0 0 2px}
.card .sub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.seg{display:flex;background:var(--fondo);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;padding:7px 4px;border-radius:8px;color:var(--ink2);font-weight:500}
.seg button.on{background:#fff;color:var(--notte);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cv{position:relative;height:230px}
.cli{list-style:none;margin:0;padding:0}
.cli li{padding:9px 0;border-bottom:1px solid var(--linea)}
.cli li:last-child{border:0}
.cli .a{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.cli .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cli .x{flex:none;font-variant-numeric:tabular-nums;font-weight:500;color:var(--notte)}
.cli .b{height:5px;background:var(--fondo);border-radius:3px;margin-top:5px;overflow:hidden}
.cli .b i{display:block;height:100%;background:var(--blu);border-radius:3px}
.cli .d{display:none;font-size:12px;color:var(--ink2);margin-top:5px}
.cli li.open .d{display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px}
.p-ok{background:#E3F0DE;color:#2E6B2E}.p-me{background:#F4EEDA;color:#7A6414}.p-ko{background:#F6D9D4;color:#9B2C1E}
.nota{font-size:11.5px;color:var(--ink3);margin-top:16px;line-height:1.45}
.vuoto{font-size:13px;color:var(--ink2);padding:10px 0}
/* blocco */
#lock{position:fixed;inset:0;background:var(--notte);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:20}
#lock img{height:40px;margin-bottom:34px}
#lock h2{font-weight:300;font-size:22px;margin:0 0 18px}
#lock input{width:100%;max-width:320px;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;outline:none}
#lock button{margin-top:12px;width:100%;max-width:320px;font:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:12px;border:0;background:var(--arancio);color:var(--notte)}
#lock label{font-size:13px;color:#B9BBC0;margin-top:14px;display:flex;align-items:center;gap:8px}
#lock .err{color:#F8C881;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>

<script>
'use strict';
const COL = { GR: '#010D23', PD: '#F19004', SE: '#010D23', MR: '#02509D', FS: '#80A7CE' };
const ORD = ['PD', 'SE', 'MR'];
let D, UI = { soc: 'GR', met: 'ric', cli: 'ric' }, CH = {};
const $ = id => document.getElementById(id);
const nf0 = { format: v => { const n = Math.round(v), a = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '-' : '') + a; } }, nf1 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const mln = v => nf1.format(v / 1e6), k = v => nf0.format(v / 1e3), pc = v => isFinite(v) ? nf1.format(v * 100) + '%' : '–';
const somma = a => a.reduce((s, x) => s + x, 0);

// ---------- sblocco: PBKDF2 (200.000 passaggi, SHA-256) -> AES-GCM 256
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function apri(pw) {
  const P = JSON.parse($('cifrato').textContent), enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
  return JSON.parse(new TextDecoder().decode(out));
}
async function entra(pw, salva) {
  try { D = await apri(pw); } catch (e) { $('err').textContent = 'Password non corretta'; try { localStorage.removeItem('hl_pw'); } catch (x) {} return; }
  try { if (salva) localStorage.setItem('hl_pw', pw); } catch (x) {}
  $('lock').remove(); $('top').hidden = false; $('app').hidden = false; avvia();
}
$('entra').onclick = () => entra($('pw').value, $('ricorda').checked);
$('pw').onkeydown = e => { if (e.key === 'Enter') $('entra').click(); };
try { const s = localStorage.getItem('hl_pw'); if (s) entra(s, true); } catch (x) {}

// ---------- dati per la selezione
function serie(soc, met) {
  const keys = soc === 'GR' ? ORD : [soc];
  const n = D.mesi.length, z = () => Array(n).fill(0);
  if (met === 'org') return keys.map(s => ({ s, v: D.org[s] || z() }));
  if (met === 'mpc') { const r = z(), m = z(); keys.forEach(s => D.mens[s].ric.forEach((v, i) => { r[i] += v; m[i] += D.mens[s].marg[i]; })); return [{ s: soc, v: r.map((v, i) => v ? m[i] / v : null) }]; }
  return keys.map(s => ({ s, v: D.mens[s][met] }));
}
function tot(soc, f) { return (soc === 'GR' ? ORD : [soc]).reduce((a, s) => a + somma(D.mens[s][f]), 0); }

function avvia() {
  const ult = D.mesi[D.mesi.length - 1];
  $('per').innerHTML = 'Gen – ' + ult + ' ' + D.periodo.slice(0, 4) + '<br>valori progressivi';
  $('chips').innerHTML = ['GR', 'PD', 'SE', 'MR', 'FS'].map(s => '<button class="chip" data-s="' + s + '">' + (s !== 'GR' ? '<i style="background:' + (s === 'SE' ? '#fff' : COL[s]) + ';' + (s === 'SE' ? 'border:1px solid #fff' : '') + '"></i>' : '') + D.nomi[s] + '</button>').join('');
  $('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { UI.soc = b.dataset.s; disegna(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif"; Chart.defaults.font.size = 11; Chart.defaults.color = '#6E6E6D';
  disegna();
}

function kpi() {
  const s = UI.soc, ce = D.ce[s] || {}, stat = s !== 'FS';
  const ric = ce.ricavi || 0, eb = ce.ebitda || 0;
  const org = s === 'GR' ? ORD.map(x => D.org[x]).reduce((a, v) => a.map((y, i) => y + v[i])) : D.org[s];
  const o1 = org[org.length - 1], o0 = org[0];
  const mr = stat ? tot(s, 'marg') / tot(s, 'ric') : NaN;
  return '<div class="kpi">' +
    '<div class="k acc"><div class="l">Ricavi</div><div class="v">' + mln(ric) + '<small>mln €</small></div><div class="s">dai bilanci' + (s === 'GR' ? ', consolidato' : '') + '</div></div>' +
    '<div class="k"><div class="l">EBITDA adj</div><div class="v">' + mln(eb) + '<small>mln €</small></div><div class="s">margine ' + pc(eb / ric) + '</div></div>' +
    '<div class="k"><div class="l">Margine commesse</div><div class="v">' + (stat ? nf1.format(mr * 100) + '<small>%</small>' : '–') + '</div><div class="s">' + (stat ? k(tot(s, 'marg')) + ' k€ su ' + k(tot(s, 'ric')) + ' k€' : 'non significativo per il collettore') + '</div></div>' +
    '<div class="k"><div class="l">Organico</div><div class="v">' + nf0.format(o1) + '<small>persone</small></div><div class="s">' + (o1 - o0 >= 0 ? '<span class="up">+' : '<span class="dn">') + nf0.format(o1 - o0) + '</span> da gennaio</div></div></div>';
}

function disegna() {
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.s === UI.soc));
  $('tit').textContent = UI.soc === 'GR' ? 'Highlights del Gruppo' : D.nomi[UI.soc];
  Object.values(CH).forEach(c => c.destroy()); CH = {};
  const stat = UI.soc !== 'FS';
  let h = kpi();
  if (stat) {
    h += '<div class="card"><h2>Andamento mese per mese</h2><div class="sub">' + (UI.soc === 'GR' ? 'per società · tocca la legenda per escluderne una' : 'statistiche delle commesse') + '</div>' +
      '<div class="seg" id="met">' + [['ric', 'Ricavi'], ['marg', 'Margine'], ['mpc', 'Margine %'], ['ore', 'Ore']].map(([v, l]) => '<button data-v="' + v + '" class="' + (UI.met === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><div class="cv"><canvas id="c1"></canvas></div></div>';
  }
  h += '<div class="card"><h2>Organico</h2><div class="sub">persone in forza a fine mese</div><div class="cv" style="height:190px"><canvas id="c2"></canvas></div></div>';
  if (UI.soc === 'GR') h += '<div class="card"><h2>Peso delle società</h2><div class="sub">ricavi ed EBITDA adj dai bilanci, prima delle elisioni</div><div class="cv" style="height:200px"><canvas id="c3"></canvas></div></div>';
  if (stat) {
    const L = D.top[UI.soc] || [];
    const R = UI.cli === 'mpc' ? [...L].sort((a, b) => b[2] / b[1] - a[2] / a[1]) : L, mx = Math.max(...L.map(x => x[1]), 1);
    h += '<div class="card"><h2>Primi clienti</h2><div class="sub">fatturato e margine di commessa · tocca un cliente per il dettaglio</div><div class="seg" id="ord">' + [['ric', 'Per fatturato'], ['mpc', 'Per margine %']].map(([v, l]) => '<button data-v="' + v + '" class="' + (UI.cli === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><ul class="cli">' +
      R.slice(0, 10).map(x => { const m = x[2] / x[1], cl = m >= .34 ? 'p-ok' : m >= .30 ? 'p-me' : 'p-ko';
        return '<li><div class="a"><span class="n">' + x[0] + '</span><span class="x">' + k(x[1]) + ' k€<span class="pill ' + cl + '">' + nf1.format(m * 100) + '%</span></span></div><div class="b"><i style="width:' + (x[1] / mx * 100) + '%"></i></div><div class="d">Margine ' + k(x[2]) + ' k€' + (x[3] ? ' · ' + x[3] : '') + '</div></li>'; }).join('') + '</ul></div>';
  } else h += '<div class="card"><h2>Futur-A S.r.l.</h2><div class="vuoto">Raccoglie e fattura le commesse dei clienti e le gira in subfornitura alle società del gruppo: i suoi ricavi e margini di commessa sono già nelle società che fanno il lavoro.</div></div>';
  h += '<div class="nota">' + D.fonte + '. Ricavi ed EBITDA adj dai bilanci (per il Gruppo: consolidato management account). Margine commesse e primi clienti dalle statistiche, al netto dei rapporti infragruppo. Riservato.</div>';
  $('app').innerHTML = h;
  if (stat) {
    $('met').onclick = e => { const b = e.target.closest('button'); if (b) { UI.met = b.dataset.v; disegna(); } };
    $('ord').onclick = e => { const b = e.target.closest('button'); if (b) { UI.cli = b.dataset.v; disegna(); } };
    document.querySelectorAll('.cli li').forEach(li => li.onclick = () => li.classList.toggle('open'));
    graficoMesi();
  }
  graficoOrg(); if (UI.soc === 'GR') graficoPeso();
}

const asseK = { ticks: { callback: v => nf0.format(v / 1000) + 'k' }, grid: { color: '#EEE' } };
function graficoMesi() {
  const S = serie(UI.soc, UI.met), pct = UI.met === 'mpc', ore = UI.met === 'ore';
  CH.c1 = new Chart($('c1'), {
    type: pct ? 'line' : 'bar',
    data: { labels: D.mesi, datasets: S.map(x => ({ label: D.nomi[x.s], data: x.v, backgroundColor: pct ? 'rgba(241,144,4,.12)' : COL[x.s], borderColor: pct ? '#F19004' : COL[x.s], borderWidth: pct ? 2.5 : 0, borderRadius: 4, fill: pct, tension: .3, pointRadius: pct ? 3 : 0 })) },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: S.length > 1, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } },
        tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + (pct ? pc(c.raw) : ore ? nf0.format(c.raw) + ' h' : k(c.raw) + ' k€'),
          footer: it => it.length > 1 && !pct ? 'Totale: ' + (ore ? nf0.format(somma(it.map(i => i.raw))) + ' h' : k(somma(it.map(i => i.raw))) + ' k€') : '' } } },
      scales: { x: { stacked: !pct, grid: { display: false } }, y: pct ? { ticks: { callback: v => nf0.format(v * 100) + '%' }, grid: { color: '#EEE' } } : Object.assign({ stacked: true }, ore ? { ticks: { callback: v => nf0.format(v / 1000) + 'k h' }, grid: { color: '#EEE' } } : asseK) } }
  });
}
function graficoOrg() {
  const S = serie(UI.soc === 'FS' ? 'FS' : UI.soc, 'org');
  CH.c2 = new Chart($('c2'), { type: 'bar', data: { labels: D.mesi, datasets: S.map(x => ({ label: D.nomi[x.s], data: x.v, backgroundColor: COL[x.s], borderRadius: 4 })) },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: S.length > 1, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } },
      tooltip: { callbacks: { footer: it => it.length > 1 ? 'Totale: ' + somma(it.map(i => i.raw)) : '' } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: '#EEE' } } } } });
}
function graficoPeso() {
  const S = ['PD', 'SE', 'MR', 'FS'];
  CH.c3 = new Chart($('c3'), { type: 'bar', data: { labels: S.map(s => D.nomi[s]), datasets: [
      { label: 'Ricavi', data: S.map(s => D.ce[s].ricavi), backgroundColor: S.map(s => COL[s]), borderRadius: 4 },
      { label: 'EBITDA adj', data: S.map(s => D.ce[s].ebitda), backgroundColor: '#F8C881', borderRadius: 4 }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + k(c.raw) + ' k€' + (c.datasetIndex === 1 ? ' (' + pc(c.raw / D.ce[S[c.dataIndex]].ricavi) + ')' : '') } } },
      scales: { x: asseK, y: { grid: { display: false } } } } });
}
</script>
</body>
</html>
