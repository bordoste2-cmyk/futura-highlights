<title>Futur-A Highlights</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--notte:#010D23;--blu:#02509D;--arancio:#F19004;--ink:#3C3C3B;--ink2:#6E6E6D;--ink3:#9E9E9D;--linea:#E4E4E2;--fondo:#F2F2F0;--card:#fff;--ok:#2E6B2E;--ko:#9B2C1E;--me:#7A6414}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
.top{background:var(--notte);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;position:sticky;top:0;z-index:5}
.top .r{display:flex;align-items:center;justify-content:space-between}
.top img{height:26px}
.top .per{font-size:12px;color:#B9BBC0;text-align:right;line-height:1.3}
.top h1{font-weight:300;font-size:26px;margin:14px 0 10px;letter-spacing:.2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:500}
.chip.on{background:#fff;color:var(--notte);border-color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1px solid rgba(255,255,255,.6)}
main{padding:14px 12px 40px;max-width:720px;margin:0 auto}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
.k.acc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--arancio)}
.k .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);font-weight:500}
.k .v{font-family:'Syne',sans-serif;font-weight:700;font-size:27px;color:var(--notte);margin:6px 0 2px;letter-spacing:-.5px}
.k .v small{font-family:'DM Sans';font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0}
.k .s{font-size:12px;color:var(--ink2);line-height:1.45}
.up{color:var(--ok);font-weight:600}.dn{color:var(--ko);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:15px;font-weight:500;color:var(--notte);margin:0 0 2px}
.card .sub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.seg{display:flex;background:var(--fondo);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;padding:7px 6px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--notte);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cv{position:relative;height:230px}
.cli{list-style:none;margin:0;padding:0}
.cli li{padding:9px 0;border-bottom:1px solid var(--linea)}
.cli li:last-child{border:0}
.cli .a{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.cli .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cli .x{flex:none;font-variant-numeric:tabular-nums;font-weight:500;color:var(--notte)}
.cli .b{height:5px;background:var(--fondo);border-radius:3px;margin-top:5px;overflow:hidden}
.cli .b i{display:block;height:100%;border-radius:3px}
.cli .d{display:none;font-size:12px;color:var(--ink2);margin-top:5px}
.cli li.open .d{display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px}
.p-ok{background:#E3F0DE;color:var(--ok)}.p-me{background:#F4EEDA;color:var(--me)}.p-ko{background:#F6D9D4;color:var(--ko)}
.righe{width:100%;border-collapse:collapse;font-size:13px}
.righe td{padding:7px 0;border-bottom:1px solid var(--linea)}.righe tr:last-child td{border:0}
.righe td.n{text-align:right;font-variant-numeric:tabular-nums}
.nota{font-size:11.5px;color:var(--ink3);margin-top:16px;line-height:1.45}
#lock{position:fixed;inset:0;background:var(--notte);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:20}
#lock img{height:40px;margin-bottom:34px}
#lock h2{font-weight:300;font-size:22px;margin:0 0 18px}
#lock input[type=password]{width:100%;max-width:320px;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;outline:none}
#lock button{margin-top:12px;width:100%;max-width:320px;font:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:12px;border:0;background:var(--arancio);color:var(--notte)}
#lock label{font-size:13px;color:#B9BBC0;margin-top:14px;display:flex;align-items:center;gap:8px}
#lock .err{color:#F8C881;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>

<script>
'use strict';
/* La pagina NON calcola i numeri: li riceve gia' calcolati dal Portale (gli stessi del Report del Comitato,
   esportati con «Esporta highlights»). Qui si fanno solo somme dei mesi e rapporti fra numeri ricevuti. */
let H, L, UI = { liv: 'GROUP', met: 'ric', cli: 'top' }, CH = {};
const $ = id => document.getElementById(id);
const MESI = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
const MESI_L = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const grp = n => String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const nf0 = v => v == null ? '–' : (v < 0 ? '−' : '') + grp(v);
const dec = (v, d) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const mln = v => v == null ? '–' : dec(v / 1e6, 1), k = v => v == null ? '–' : nf0(v / 1e3);
const pc = v => v == null || !isFinite(v) ? '–' : dec(v * 100, 1) + '%';
const somma = (a, f) => a.reduce((s, x) => s + (x ? (f ? x[f] : x) || 0 : 0), 0);
const delta = (a, b) => b ? (a - b) / Math.abs(b) : null;
const freccia = (d, inv) => d == null ? '' : '<span class="' + ((inv ? -d : d) >= 0 ? 'up' : 'dn') + '">' + (d >= 0 ? '+' : '−') + dec(Math.abs(d) * 100, 1) + '%</span>';
// colori delle soglie, come nel Portale: margine (piu' alto e' meglio) e non-chargeable (piu' basso e' meglio)
const clMarg = (m, s) => m == null ? '' : m >= s.buono ? 'p-ok' : m >= s.medio ? 'p-me' : 'p-ko';
const clNc = (v, s) => v == null ? '' : v <= s.buono ? 'p-ok' : v <= s.medio ? 'p-me' : 'p-ko';

// ---------- sblocco: PBKDF2-SHA256 -> AES-GCM 256
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function apri(pw) {
  const P = JSON.parse($('cifrato').textContent), enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c))));
}
async function entra(pw, salva) {
  $('err').textContent = '';
  try { H = await apri(pw); } catch (e) { $('err').textContent = 'Password non corretta'; try { localStorage.removeItem('hl_pw'); } catch (x) {} return; }
  try { if (salva) localStorage.setItem('hl_pw', pw); } catch (x) {}
  $('lock').remove(); $('top').hidden = false; $('app').hidden = false; avvia();
}
$('entra').onclick = () => entra($('pw').value, $('ricorda').checked);
$('pw').onkeydown = e => { if (e.key === 'Enter') $('entra').click(); };
try { const s = localStorage.getItem('hl_pw'); if (s) entra(s, true); } catch (x) {}

function avvia() {
  const n = H.ultimoMese;
  $('per').innerHTML = 'Gennaio – ' + MESI_L[n - 1] + ' ' + H.anno + '<br>progressivo';
  const breve = { GROUP: 'Gruppo', PD: 'People Design', MR_SG: 'Manganorobot', SE_SG: 'Smart' };
  $('chips').innerHTML = H.ordine.map(id => '<button class="chip" data-l="' + id + '">' + (id !== 'GROUP' ? '<i style="background:' + H.livelli[id].col + '"></i>' : '') + (breve[id] || H.livelli[id].nome) + '</button>').join('');
  $('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { UI.liv = b.dataset.l; disegna(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif"; Chart.defaults.font.size = 11; Chart.defaults.color = '#6E6E6D';
  disegna();
}

// ---------- i numeri del livello scelto
function numeri() {
  const n = H.ultimoMese, ce = L.ce, bdg = L.bdg.slice(0, n), kp = L.kpi;
  const ric = somma(ce, 'ric'), eb = somma(ce, 'ebitda'), ricB = somma(bdg, 'ric'), ebB = somma(bdg, 'ebitda');
  const oreNc = somma(kp, 'oreNc'), idle = somma(kp, 'idle'), ricS = somma(kp, 'ric'), margS = somma(kp, 'marg');
  const org = L.org[n - 1] || {}, o0 = L.orgDic || {};
  return { ric, eb, ricB, ebB, nc: oreNc ? idle / oreNc : null, margS: ricS ? margS / ricS : null, ricS, margSE: margS,
           teste: (org.prod || 0) + (org.staff || 0), teste0: (o0.prod || 0) + (o0.staff || 0), est: org.est || 0,
           py: L.pyYtd };
}
function kpi(N) {
  const pfnM = H.pfn.mesi[H.ultimoMese - 1];
  let h = '<div class="kpi">' +
    '<div class="k acc"><div class="l">Ricavi</div><div class="v">' + mln(N.ric) + '<small>mln €</small></div><div class="s">budget ' + freccia(delta(N.ric, N.ricB)) +
      (N.py ? '<br>anno prima ' + freccia(delta(N.ric, N.py.ric)) + (N.py.stima ? ' <span title="anno prima stimato">*</span>' : '') : '') + '</div></div>' +
    '<div class="k"><div class="l">EBITDA adj</div><div class="v">' + mln(N.eb) + '<small>mln €</small></div><div class="s">margine ' + pc(N.eb / N.ric) + '<br>budget ' + freccia(delta(N.eb, N.ebB)) + '</div></div>';
  if (UI.liv === 'GROUP' && pfnM) h +=
    '<div class="k"><div class="l">PFN adjusted</div><div class="v">' + mln(pfnM.pfnCov) + '<small>mln €</small></div><div class="s">PFN contabile ' + mln(pfnM.pfn) + ' mln<br>a fine ' + MESI_L[H.ultimoMese - 1] + '</div></div>' +
    '<div class="k"><div class="l">Leva covenant</div><div class="v">' + (pfnM.leva == null ? '–' : dec(pfnM.leva, 2) + '<small>x</small>') + '</div><div class="s">limite ' + (pfnM.soglia ? dec(pfnM.soglia, 2) + 'x al ' + pfnM.sogliaData : '–') + (pfnM.stima ? '<br>EBITDA 12 mesi in parte stimato' : '') + '</div></div>';
  h += '<div class="k"><div class="l">Non-chargeable</div><div class="v">' + (N.nc == null ? '–' : dec(N.nc * 100, 1) + '<small>%</small>') + '</div><div class="s"><span class="pill ' + clNc(N.nc, L.soglie.nc) + '" style="margin:0">' + (N.nc == null ? '' : N.nc <= L.soglie.nc.buono ? 'in linea' : N.nc <= L.soglie.nc.medio ? 'attenzione' : 'alto') + '</span> ore ferme dei dipendenti</div></div>' +
    '<div class="k"><div class="l">Organico</div><div class="v">' + nf0(N.teste) + '<small>persone</small></div><div class="s">' + (N.teste - N.teste0 >= 0 ? '<span class="up">+' : '<span class="dn">−') + nf0(Math.abs(N.teste - N.teste0)) + '</span> da dicembre · esterni ' + nf0(N.est) + '</div></div></div>';
  return h;
}

function disegna() {
  L = H.livelli[UI.liv];
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.l === UI.liv));
  $('tit').textContent = UI.liv === 'GROUP' ? 'Highlights del Gruppo' : L.nome;
  Object.values(CH).forEach(c => c.destroy()); CH = {};
  const N = numeri();
  let h = kpi(N);
  h += '<div class="card"><h2>Mese per mese</h2><div class="sub">' + ({ ric: 'ricavi: consuntivo e budget', eb: 'EBITDA adj: consuntivo e budget', mc: 'margine di commessa, statistiche', nc: 'ore ferme sulle ore dei dipendenti', ore: 'ore lavorate, statistiche' }[UI.met]) + '</div>' +
    '<div class="seg" id="met">' + [['ric', 'Ricavi'], ['eb', 'EBITDA'], ['mc', 'Margine %'], ['nc', 'Non-charg.'], ['ore', 'Ore']].map(([v, l]) => '<button data-v="' + v + '" class="' + (UI.met === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><div class="cv"><canvas id="c1"></canvas></div></div>';
  if (UI.liv === 'GROUP') {
    h += '<div class="card"><h2>Le divisioni</h2><div class="sub">ricavi ed EBITDA adj progressivi, con il ribaltamento di Futur-A S.r.l.</div><table class="righe">' +
      H.ordine.filter(id => id !== 'GROUP').map(id => { const X = H.livelli[id], r = somma(X.ce, 'ric'), e = somma(X.ce, 'ebitda');
        return '<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + X.col + ';margin-right:7px"></i>' + X.nome + '</td><td class="n">' + mln(r) + ' mln</td><td class="n" style="width:92px">' + mln(e) + ' <span style="color:var(--ink3)">(' + pc(e / r) + ')</span></td></tr>'; }).join('') + '</table></div>';
    if (H.ct) h += '<div class="card"><h2>Current trading</h2><div class="sub">ricavi mensili consolidati, ultimi tre anni</div><div class="cv" style="height:210px"><canvas id="c4"></canvas></div></div>';
    h += '<div class="card"><h2>Posizione finanziaria netta</h2><div class="sub">PFN adjusted (covenant) a fine mese e leva sull’EBITDA degli ultimi 12 mesi</div><div class="cv" style="height:210px"><canvas id="c5"></canvas></div></div>';
  } else if (L.ncSoc && L.ncSoc.length > 1) {
    h += '<div class="card"><h2>Non-chargeable per società</h2><div class="sub">progressivo, ore ferme sulle ore dei dipendenti</div><table class="righe">' +
      L.ncSoc.map(x => '<tr><td>' + x.nome + '</td><td class="n">' + nf0(x.ore) + ' h</td><td class="n" style="width:80px"><span class="pill ' + clNc(x.nc, x.soglie) + '">' + pc(x.nc) + '</span></td></tr>').join('') + '</table></div>';
  }
  h += '<div class="card"><h2>Organico</h2><div class="sub">produttivi e staff a fine mese; esterni con timesheet a parte</div><div class="cv" style="height:200px"><canvas id="c2"></canvas></div></div>';
  const CL = L.clienti || {}, R = CL[UI.cli] || [], mx = Math.max(1, ...(CL.top || []).map(x => x.ric)), pp = v => (v >= 0 ? '+' : '−') + dec(Math.abs(v) * 100, 1) + ' p.p.';
  const sottoCli = { top: 'i 10 clienti con più ricavo, progressivo', best: 'margine % più alto', worst: 'margine % più basso' }[UI.cli] + (UI.cli !== 'top' ? ', fra i clienti sopra lo ' + dec(CL.peso * 100, 2) + '% del ricavo (' + k(CL.minimo) + ' k€)' : '') + ' · tocca un cliente';
  h += '<div class="card"><h2>Clienti</h2><div class="sub">' + sottoCli + '</div><div class="seg" id="ord">' + [['top', 'Top ricavo'], ['best', 'Best margine'], ['worst', 'Worst margine']].map(([v, l]) => '<button data-v="' + v + '" class="' + (UI.cli === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><ul class="cli">' +
    R.map(x => { const m = x.margPct;
      return '<li><div class="a"><span class="n">' + x.nome + '</span><span class="x">' + k(x.ric) + ' k€<span class="pill ' + clMarg(m, L.soglie.margine) + '">' + pc(m) + '</span></span></div><div class="b"><i style="width:' + (x.ric / mx * 100) + '%;background:' + L.col + '"></i></div>' +
        '<div class="d">Margine ' + k(x.marg) + ' k€' + (CL.tot ? ' · quota ' + pc(x.ric / CL.tot) : '') + ' · anno prima ' + (x.prec ? k(x.prec) + ' k€ ' + freccia(delta(x.ric, x.prec)) : 'nuovo') + (x.margPctPrec != null ? ' · margine ' + pp(m - x.margPctPrec) : '') + (x.ore ? ' · ' + nf0(x.ore) + ' ore' : '') + '</div></li>'; }).join('') + '</ul></div>';
  h += '<div class="nota">Numeri del Portale Futur-A, gli stessi del Report del Comitato di ' + MESI_L[H.ultimoMese - 1] + ' ' + H.anno + ' (esportati il ' + new Date(H.generato).toLocaleDateString('it-IT') + '). ' +
    'Ricavi ed EBITDA adj dai bilanci; budget ' + L.bdgVersione + '. Margine, non-chargeable, ore e clienti dalle statistiche delle commesse, al netto dei rapporti infragruppo.' + (L.pyYtd && L.pyYtd.stima ? ' * Anno prima stimato dove manca il bilancio mensile.' : '') + ' Riservato.</div>';
  $('app').innerHTML = h;
  $('met').onclick = e => { const b = e.target.closest('button'); if (b) { UI.met = b.dataset.v; disegna(); } };
  $('ord').onclick = e => { const b = e.target.closest('button'); if (b) { UI.cli = b.dataset.v; disegna(); } };
  document.querySelectorAll('.cli li').forEach(li => li.onclick = () => li.classList.toggle('open'));
  grafMesi(); grafOrg(); if (UI.liv === 'GROUP') { if (H.ct) grafCt(); grafPfn(); }
}

const lab = () => MESI.slice(0, H.ultimoMese);
const leg = { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } };
const yK = { ticks: { callback: v => nf0(v / 1000) + 'k' }, grid: { color: '#EEE' } };
const yP = { ticks: { callback: v => dec(v * 100, 0) + '%' }, grid: { color: '#EEE' } };
function grafMesi() {
  const m = UI.met, n = H.ultimoMese, col = L.col;
  let ds, y = yK, fmt = v => k(v) + ' k€';
  if (m === 'ric' || m === 'eb') {
    const f = m === 'ric' ? 'ric' : 'ebitda';
    const bdgLine = { type: 'line', label: 'Budget', data: L.bdg.slice(0, n).map(x => x ? x[f] : null), borderColor: '#9B2C1E', backgroundColor: '#9B2C1E', borderDash: [5, 4], borderWidth: 2, pointRadius: 2.5, order: 1, stack: 'bdg' };
    if (UI.liv === 'GROUP') {   // barre divise per sottogruppo; il resto (holding, Futur-A S.r.l. non ribaltata, elisioni) in grigio, cosi' il totale e' quello del Gruppo
      ds = divisioni(m => (x => x ? x[f] : 0), L.ce.map(x => x ? x[f] : null), 'ce');
      ds.push(bdgLine);
    } else ds = [{ type: 'bar', label: 'Consuntivo', data: L.ce.map(x => x ? x[f] : null), backgroundColor: col, borderRadius: 4, order: 2 }, { ...bdgLine, borderColor: '#F19004', backgroundColor: '#F19004' }];
  } else if (m === 'mc' || m === 'nc') {
    const v = L.kpi.map(x => !x ? null : m === 'mc' ? (x.ric ? x.marg / x.ric : null) : x.nc), s = m === 'mc' ? L.soglie.margine : L.soglie.nc;
    ds = [{ type: 'line', label: m === 'mc' ? 'Margine %' : 'Non-chargeable %', data: v, borderColor: col, backgroundColor: col, borderWidth: 2.5, pointRadius: 3, tension: .3 },
          { type: 'line', label: m === 'mc' ? 'soglia buono' : 'soglia in linea', data: v.map(() => s.buono), borderColor: '#2E6B2E', borderWidth: 1, borderDash: [3, 3], pointRadius: 0 },
          { type: 'line', label: 'soglia attenzione', data: v.map(() => s.medio), borderColor: '#B8860B', borderWidth: 1, borderDash: [3, 3], pointRadius: 0 }];
    y = yP; fmt = pc;
  } else {
    ds = UI.liv === 'GROUP' ? divisioni(null, L.kpi.map(x => x ? x.ore : null), 'kpi', 'ore') : [{ type: 'bar', label: 'Ore', data: L.kpi.map(x => x ? x.ore : null), backgroundColor: col, borderRadius: 4 }];
    y = { ticks: { callback: v => nf0(v / 1000) + 'k' }, grid: { color: '#EEE' } }; fmt = v => nf0(v) + ' h';
  }
  const pila = ds.some(d => d.stack === 'div');
  CH.c1 = new Chart($('c1'), { data: { labels: lab(), datasets: ds }, options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: ds.length > 1, ...leg }, tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmt(c.raw),
      footer: it => pila ? 'Totale Gruppo: ' + fmt(somma(it.filter(i => i.dataset.stack === 'div').map(i => i.raw))) : '' } } },
    scales: { x: { grid: { display: false }, stacked: pila }, y: { ...y, stacked: pila } } } });
}
// le barre del Gruppo divise per sottogruppo, con i loro colori; quello che manca per arrivare al totale del Gruppo
// (holding, Futur-A S.r.l. per la parte non ribaltata, elisioni infragruppo) va in una fetta grigia
function divisioni(_, tot, chiave, campo) {
  const f = campo || (UI.met === 'ric' ? 'ric' : 'ebitda'), ids = H.ordine.filter(id => id !== 'GROUP');
  const val = (id, i) => { const x = H.livelli[id][chiave][i]; return x ? x[f] || 0 : 0; };
  const ds = ids.map(id => ({ type: 'bar', label: H.livelli[id].nome.replace('Gruppo ', ''), data: tot.map((t, i) => t == null ? null : val(id, i)), backgroundColor: H.livelli[id].col, stack: 'div', order: 2 }));
  const resto = tot.map((t, i) => t == null ? null : t - ids.reduce((s, id) => s + val(id, i), 0));
  if (resto.some(v => v && Math.abs(v) > 1000)) ds.push({ type: 'bar', label: 'Holding ed elisioni', data: resto, backgroundColor: '#C9CACE', stack: 'div', order: 2 });
  return ds;
}
function grafOrg() {
  const o = L.org;
  CH.c2 = new Chart($('c2'), { type: 'bar', data: { labels: lab(), datasets: [
      { label: 'Produttivi', data: o.map(x => x ? x.prod : null), backgroundColor: L.col, borderRadius: 3, stack: 'a' },
      { label: 'Staff', data: o.map(x => x ? x.staff : null), backgroundColor: '#9E9E9D', borderRadius: 3, stack: 'a' },
      { type: 'line', label: 'Esterni', data: o.map(x => x ? x.est : null), borderColor: '#F19004', backgroundColor: '#F19004', borderWidth: 2, pointRadius: 2.5 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: leg, tooltip: { callbacks: { footer: it => 'Dipendenti: ' + nf0(somma(it.filter(i => i.dataset.stack).map(i => i.raw))) } } },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: '#EEE' } } } } });
}
function grafCt() {
  const cols = ['#C0D3E6', '#80A7CE', '#010D23'];
  CH.c4 = new Chart($('c4'), { type: 'line', data: { labels: MESI, datasets: H.ct.anni.map((a, i) => ({ label: String(a), data: H.ct.conso[i], borderColor: cols[i], backgroundColor: cols[i], borderWidth: i === 2 ? 3 : 2, pointRadius: i === 2 ? 3 : 0, tension: .3 })) },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: leg, tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + k(c.raw) + ' k€' } } }, scales: { x: { grid: { display: false } }, y: yK } } });
}
function grafPfn() {
  const P = H.pfn.mesi;
  CH.c5 = new Chart($('c5'), { data: { labels: lab(), datasets: [
      { type: 'bar', label: 'PFN adjusted', data: P.map(x => x ? x.pfnCov : null), backgroundColor: '#02509D', borderRadius: 4, yAxisID: 'y' },
      { type: 'line', label: 'Leva', data: P.map(x => x ? x.leva : null), borderColor: '#F19004', backgroundColor: '#F19004', borderWidth: 2.5, pointRadius: 3, yAxisID: 'y2' },
      { type: 'line', label: 'Limite', data: P.map(x => x ? x.soglia : null), borderColor: '#9B2C1E', borderWidth: 1, borderDash: [4, 4], pointRadius: 0, yAxisID: 'y2' }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: leg, tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + (c.dataset.yAxisID === 'y2' ? dec(c.raw, 2) + 'x' : mln(c.raw) + ' mln €') } } },
      scales: { x: { grid: { display: false } }, y: { ticks: { callback: v => dec(v / 1e6, 0) + ' mln' }, grid: { color: '#EEE' } }, y2: { position: 'right', min: 0, ticks: { callback: v => dec(v, 1) + 'x' }, grid: { display: false } } } } });
}
</script>
</body>
</html>
